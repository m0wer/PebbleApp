name: Publish release

on:
  release:
    types: [published]

jobs:
  publish-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-release-deps-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            android-release-deps-${{ runner.os }}-
      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEYSTORE_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > keystore.jks
          mv androidApp/src/google-services-dummy.json androidApp/src/google-services.json
      - name: Build signed Android release
        run: ./gradlew :androidApp:assembleRelease -PUPLOAD_CRASHLYTICS_MAPPING=false
        env:
          GITHUB_ACTOR: ${{ secrets.READ_PACKAGES_ACTOR || github.actor }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Prepare Android release files
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/pebble-mobile-${RELEASE_TAG}.apk"
          sha256sum "dist/pebble-mobile-${RELEASE_TAG}.apk" > "dist/pebble-mobile-${RELEASE_TAG}.apk.sha256"
      - name: Add Android release files
        uses: softprops/action-gh-release@15d2aaca23625e5b2744248f7b68fc1e6bbff48e
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*

  publish-swift:
    if: github.repository == 'coredevices/mobileapp'
    runs-on: macos-latest
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.konan/cache
            ~/.konan/dependencies
          key: build-deps-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}

      - name: Build XCFrameworks
        run: ./gradlew assembleXCFramework

      - name: Zip XCFramework
        uses: vimtor/action-zip@v1
        with:
          files: build/xcframework/
          dest: build/xcframework.zip

      - name: Add release artifacts
        id: release_artifacts
        uses: softprops/action-gh-release@15d2aaca23625e5b2744248f7b68fc1e6bbff48e
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            build/xcframework.zip

      - name: Calculate checksums for XCFrameworks
        run: |
          cp Package.swift.template Package.swift
          echo RELEASE_CHECKSUM=$(swift package compute-checksum build/xcframework.zip) >> $GITHUB_ENV

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: 'master'

      - name: Update swift package
        run: |
          sed -e 's|RELEASE-URL|${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/xcframework.zip|;w Package.swift.tmp' Package.swift.template
          sed -e 's/RELEASE-CHECKSUM/${{ env.RELEASE_CHECKSUM }}/;w Package.swift' Package.swift.tmp

      - name: Commit swift package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "[CI] Update swift package"
          git tag swiftpm-${{ github.event.release.tag_name }}
          git push origin swiftpm-${{ github.event.release.tag_name }}

  publish-maven:
    if: github.repository == 'coredevices/mobileapp'
    runs-on: macos-latest

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.konan/cache
            ~/.konan/dependencies
          key: build-deps-${{ hashFiles('~/.gradle/**') }}-${{ hashFiles('~/.konan/**') }}

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Publish artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        # The GITHUB_REF tag comes in the format 'refs/tags/xxx'.
        # If we split on '/' and take the 3rd value,
        # we can get the release name.
        run: |
          NEW_VERSION=$(echo "${GITHUB_REF}" | cut -d "/" -f3)
          echo "New version: ${NEW_VERSION}"
          echo "Github username: ${GITHUB_ACTOR}"
          ./gradlew -Pversion=${NEW_VERSION} publish
