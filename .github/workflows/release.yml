name: Publish release

on:
  push:
    tags:
      - '*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Android release tags must contain three or four numeric components"
            exit 1
          fi
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-release-deps-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: |
            android-release-deps-${{ runner.os }}-
      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEYSTORE_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > keystore.jks
          mv androidApp/src/google-services-dummy.json androidApp/src/google-services.json
      - name: Build signed Android release
        run: ./gradlew :androidApp:assembleRelease -PUPLOAD_CRASHLYTICS_MAPPING=false
        env:
          GITHUB_ACTOR: ${{ secrets.READ_PACKAGES_ACTOR || github.actor }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Prepare Android release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk \
            "dist/PebbleApp-${RELEASE_TAG}.apk"
          cd dist
          sha256sum "PebbleApp-${RELEASE_TAG}.apk" > \
            "PebbleApp-${RELEASE_TAG}.apk.sha256"
      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: PebbleApp ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
